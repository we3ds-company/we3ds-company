name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  # ─── Documentation & Repository Integrity ──────────────────────────────────
  docs-check:
    name: Documentation & Repository Integrity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify Core Documentation Files
        run: |
          echo "Validating core company documentation files..."
          test -f README.md || (echo "README.md missing" && exit 1)
          test -f CONTRIBUTING.md || (echo "CONTRIBUTING.md missing" && exit 1)
          test -f CODE_OF_CONDUCT.md || (echo "CODE_OF_CONDUCT.md missing" && exit 1)
          test -f LICENSE || (echo "LICENSE missing" && exit 1)
          test -f CHANGELOG.md || (echo "CHANGELOG.md missing" && exit 1)
          test -f ROADMAP.md || (echo "ROADMAP.md missing" && exit 1)
          test -d docs || (echo "docs directory missing" && exit 1)
          test -f docs/README.md || (echo "docs/README.md missing" && exit 1)
          test -f docs/Standards.md || (echo "docs/Standards.md missing" && exit 1)
          test -f docs/Workflow.md || (echo "docs/Workflow.md missing" && exit 1)
          test -f docs/Code-Quality.md || (echo "docs/Code-Quality.md missing" && exit 1)
          test -f docs/Security.md || (echo "docs/Security.md missing" && exit 1)
          test -f docs/Frontend.md || (echo "docs/Frontend.md missing" && exit 1)
          test -f docs/Audit.md || (echo "docs/Audit.md missing" && exit 1)
          echo "All core documentation and repository standard files are present and verified."
  # ─── PHP / Laravel ───────────────────────────────────────────────────────────
  laravel:
    name: Laravel CI
    runs-on: ubuntu-latest
    if: ${{ hashFiles('composer.json') != '' }}

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: testing
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo, pdo_mysql, bcmath, redis
          coverage: xdebug

      - name: Cache Composer packages
        uses: actions/cache@v3
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy .env
        run: cp .env.example .env

      - name: Generate application key
        run: php artisan key:generate

      - name: Run migrations
        run: php artisan migrate --force
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: testing
          DB_USERNAME: root
          DB_PASSWORD: root

      - name: Run PHP CS Fixer (lint)
        run: vendor/bin/php-cs-fixer fix --dry-run --diff
        continue-on-error: true

      - name: Run PHPStan (static analysis)
        run: vendor/bin/phpstan analyse
        continue-on-error: true

      - name: Run tests
        run: php artisan test --parallel
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: testing
          DB_USERNAME: root
          DB_PASSWORD: root

  # ─── Node.js / Frontend ──────────────────────────────────────────────────────
  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    if: ${{ hashFiles('package.json') != '' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript check
        run: npm run type-check
        continue-on-error: true

      - name: Run tests
        run: npm run test -- --coverage

      - name: Build
        run: npm run build

  # ─── .NET / ASP.NET Core ─────────────────────────────────────────────────────
  dotnet:
    name: .NET CI
    runs-on: ubuntu-latest
    if: ${{ hashFiles('*.sln') != '' || hashFiles('**/*.csproj') != '' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Run tests
        run: dotnet test --no-build --configuration Release --verbosity normal

  # ─── Security Scan ───────────────────────────────────────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.16.1
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
        continue-on-error: true
